version: '3.8'

services:
  scheduler-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scheduler?schema=public
      - MAX_WORKERS=4
      - LOG_LEVEL=info
      - LOG_DIR=/usr/src/app/logs
    volumes:
      - ./logs:/usr/src/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - scheduler-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scheduler-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=scheduler
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scheduler-network
    restart: unless-stopped

networks:
  scheduler-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
